spring.application.name=codebase-copilot
server.port=8080

# Spring Boot reads the project-local file. Maven itself does not load Compose's .env.
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:postgresql://${COPILOT_DB_HOST:127.0.0.1}:${COPILOT_DB_PORT:5433}/${COPILOT_DB_NAME:copilot_db}
spring.datasource.username=${COPILOT_DB_USER:copilot_user}
spring.datasource.password=${COPILOT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Spring AI / Ollama Configuration
# Separate configuration for Chat and Embeddings via environment variables
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3.5:4b}
spring.ai.ollama.chat.options.keep-alive=${OLLAMA_CHAT_KEEP_ALIVE:10m}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBED_MODEL:nomic-embed-text}
copilot.ollama.connect-timeout=10s
copilot.ollama.read-timeout=${OLLAMA_CHAT_READ_TIMEOUT:420s}

# Similarity floor calibrated against the TASK-008 known/absent retrieval set.
copilot.search.minimum-cosine-score=0.52

# Management / Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
